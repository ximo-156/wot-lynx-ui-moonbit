# CI uses the native filesystem/Git bridge on Linux. Installer is latest,
# not pinned: record exact versions and fail on format/interface drift.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchain versions (not pinned)
        run: moon version --all
      - name: Type-check native
        run: moon check --target native
      - name: Test native
        run: moon test --target native
      - name: Check generated interfaces and formatting
        run: |
          moon info && moon fmt
          git diff --exit-code -- '*.mbt' '*.mbti'
      - name: Build native CLI
        run: moon build --target native
      - name: Test native CLI
        run: |
          BINARY="$PWD/_build/native/debug/build/cmd/main/main.exe"
          test -x "$BINARY"
          python3 tests/integration.py --binary "$BINARY" --phase all
      - name: Test MoonImpact CLI and native process boundary
        run: |
          BINARY="$PWD/_build/native/debug/build/cmd/impact/impact.exe"
          test -x "$BINARY"
          python3 tests/impact_integration.py --binary "$BINARY"
          python3 tests/impact_native.py
      - name: Audit MoonImpact stability on a MoonBit module
        run: |
          # This checkout is itself a multi-module MoonBit workspace: the audit
          # plans it natively (no configuration) through file and Git modes.
          python3 tests/impact_stability.py \
            --binary "$PWD/_build/native/debug/build/cmd/impact/impact.exe" \
            --project "$PWD" \
            --samples 20
      - name: Audit MoonImpact stability against a real public project
        run: |
          # Structural stability gate: plans a fresh public monorepo checkout
          # through file and Git input modes. The checkout carries no private
          # reference copy, so declarations for optional assets report as
          # unresolved and the plan falls back to full; the audit checks
          # invariants, determinism and failure loudness, never a strategy.
          git clone --depth 1 https://github.com/ximo-156/wot-lynx-ui "$RUNNER_TEMP/wot-lynx-ui"
          python3 tests/impact_stability.py \
            --binary "$PWD/_build/native/debug/build/cmd/impact/impact.exe" \
            --project "$RUNNER_TEMP/wot-lynx-ui" \
            --config examples/impact-wot-lynx-ui.json \
            --samples 20
      - name: Build and test MoonBit examples
        run: |
          for module in examples/moonbit-demo examples/package-policy-demo examples/api-policy-demo/before examples/api-policy-demo/after; do
            (cd "$module" && moon check --target native && moon test --target native && moon build --target native)
          done
      - name: Lint repository under its committed scope
        run: _build/native/debug/build/cmd/main/main.exe .
