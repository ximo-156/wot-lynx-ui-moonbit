# CI uses the native filesystem/Git bridge on Linux. The official latest
# installer is not pinned: enforce moonc >= 1.0.0-rc1 and record exact versions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify compiler minimum and record toolchain versions
        run: |
          moon version --all
          python3 tests/check_toolchain_test.py
          python3 tests/check_toolchain.py
      - name: Type-check native
        run: moon check --target native
      - name: Test native
        run: moon test --target native
      - name: Check generated interfaces and formatting
        run: |
          moon info && moon fmt
          git diff --exit-code -- '*.mbt' '*.mbti'
      - name: Build native CLI
        run: moon build --target native
      - name: Set up Node.js for the real Vitest smoke test
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm for the real test runner
        uses: pnpm/action-setup@v4
        with:
          version: '10.24.0'
      - name: Test selective execution with real Vitest
        run: |
          npm install --prefix "$RUNNER_TEMP/moonimpact-vitest" \
            --ignore-scripts --no-audit --no-fund --save-exact vitest@3.2.6
          python3 tests/impact_vitest_smoke.py \
            --binary "$PWD/_build/native/debug/build/cmd/impact/impact.exe" \
            --vitest-dir "$RUNNER_TEMP/moonimpact-vitest/node_modules/vitest"
      - name: Test native CLI
        run: |
          BINARY="$PWD/_build/native/debug/build/cmd/main/main.exe"
          test -x "$BINARY"
          python3 tests/integration.py --binary "$BINARY" --phase all
      - name: Test MoonImpact CLI and native process boundary
        run: |
          BINARY="$PWD/_build/native/debug/build/cmd/impact/impact.exe"
          test -x "$BINARY"
          python3 tests/impact_integration.py --binary "$BINARY"
          python3 tests/impact_native.py
          python3 tests/impact_moonbit_corpus_test.py
      - name: Audit MoonImpact stability on a MoonBit module
        run: |
          # The repository root is a MoonBit module. The audit plans it
          # natively (no configuration) through file and Git modes.
          python3 tests/impact_stability.py \
            --binary "$PWD/_build/native/debug/build/cmd/impact/impact.exe" \
            --project "$PWD" \
            --samples 20
      - name: Audit MoonImpact stability against a real public project
        run: |
          # Structural stability gate: plans a fresh public monorepo checkout
          # through file and Git input modes. The checkout carries no private
          # reference copy, so declarations for optional assets report as
          # unresolved and the plan falls back to full; the audit checks
          # invariants, determinism and failure loudness, never a strategy.
          git clone --depth 1 https://github.com/ximo-156/wot-lynx-ui "$RUNNER_TEMP/wot-lynx-ui"
          python3 tests/impact_stability.py \
            --binary "$PWD/_build/native/debug/build/cmd/impact/impact.exe" \
            --project "$RUNNER_TEMP/wot-lynx-ui" \
            --config examples/impact-wot-lynx-ui.json \
            --samples 20
      - name: Build and test MoonBit examples
        run: |
          for module in examples/moonbit-demo examples/package-policy-demo examples/api-policy-demo/before examples/api-policy-demo/after examples/workspace-demo; do
            (cd "$module" && moon check --target native && moon test --target native && moon build --target native)
          done
      - name: Run the selected MoonBit workspace tests
        run: |
          _build/native/debug/build/cmd/impact/impact.exe plan \
            --file shared/shared.mbt --run examples/workspace-demo
      - name: Lint repository under its committed scope
        run: _build/native/debug/build/cmd/main/main.exe .
