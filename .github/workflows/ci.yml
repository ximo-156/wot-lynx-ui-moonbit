# CI: every push must pass the full native suite before it can be submitted.
# ubuntu-latest ships a C toolchain, so the native filesystem/Git bridge
# (git_native.c) compiles here even though it cannot on machines without one.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Pin the toolchain
        run: moon version --all

      - name: Type-check
        run: moon check --target wasm-gc

      - name: Unit tests (native)
        run: moon test

      - name: Refresh package interfaces
        run: moon info

      - name: Build CLI (native)
        run: moon build --target native

      - name: Integration tests (native CLI)
        run: |
          BINARY="$(find _build -name main.exe -path '*cmd/main*' | head -1)"
          if [ -z "$BINARY" ]; then
            echo "native CLI binary not found under _build/" >&2
            exit 1
          fi
          echo "testing $BINARY"
          python3 tests/integration.py --binary "$BINARY" --phase all
