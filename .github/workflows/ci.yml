# CI uses the native filesystem/Git bridge on Linux. Installer is latest,
# not pinned: record exact versions and fail on format/interface drift.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchain versions (not pinned)
        run: moon version --all
      - name: Type-check native
        run: moon check --target native
      - name: Test native
        run: moon test --target native
      - name: Check generated interfaces and formatting
        run: |
          moon info && moon fmt
          git diff --exit-code -- '*.mbt' '*.mbti'
      - name: Build native CLI
        run: moon build --target native
      - name: Test native CLI
        run: |
          BINARY="$PWD/_build/native/debug/build/cmd/main/main.exe"
          test -x "$BINARY"
          python3 tests/integration.py --binary "$BINARY" --phase all
      - name: Build and test MoonBit examples
        run: |
          for module in examples/moonbit-demo examples/package-policy-demo examples/api-policy-demo/before examples/api-policy-demo/after; do
            (cd "$module" && moon check --target native && moon test --target native && moon build --target native)
          done
      - name: Lint repository under its committed scope
        run: _build/native/debug/build/cmd/main/main.exe .
